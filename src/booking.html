<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预约 - 范曾珊钢琴艺术中心</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .date-block {
            width: 100px;
            height: 50px;
            margin: 5px;
            display: inline-block;
            text-align: center;
            line-height: 50px;
            cursor: pointer;
            color: white;
            border-radius: 5px;
        }
        .available {
            background-color: green;
        }
        .booked {
            background-color: red;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/LOGO.png" alt="钢琴艺术中心" width="40" height="40" class="d-inline-block align-text-top">
                范曾珊钢琴艺术中心
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="mine.html">我的</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <div class="container py-5">
            <h2 class="text-primary mb-4"><i class="fas fa-calendar me-2"></i>预约</h2>
            <form>
                <div class="mb-3">
                    <label for="campusSelect" class="form-label">选择校区</label>
                    <select class="form-select" id="campusSelect">
                        <option selected>选择校区</option>
                        <option value="hangzhou">杭州校区</option>
                        <option value="xiasha">下沙校区</option>
                        <option value="yuhang">余杭校区</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="roomSelect" class="form-label">选择教室</label>
                    <select class="form-select" id="roomSelect">
                        <option selected>选择教室</option>
                        <option value="101">101</option>
                        <option value="102">102</option>
                        <option value="103">103</option>
                        <option value="104">104</option>
                    </select>
                </div>
            </form>
            <div id="calendar">
                <div class="date-block available" onclick="toggleBooking(this)">2023-05-01</div>
                <div class="date-block booked" onclick="toggleBooking(this)">2023-05-02</div>
                <div class="date-block available" onclick="toggleBooking(this)">2023-05-03</div>
                <!-- 更多日期块 -->
            </div>
            <button class="btn btn-primary mt-3" onclick="confirmBooking()">确认预约</button>
        </div>
    </main>
    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <div class="container">
            <div class="row g-0">
                <div class="col nav-item">
                    <a class="nav-link" href="index.html"><i class="fas fa-home"></i><span>首页</span></a>
                </div>
                <div class="col nav-item">
                    <a class="nav-link" href="courses.html">
                        <i class="fas fa-music"></i>
                        <span>课程</span>
                    </a>
                </div>
                <div class="col nav-item">
                    <a class="nav-link" href="booking.html"><i class="fas fa-calendar"></i><span>预约</span></a>
                </div>
                <div class="col nav-item">
                    <a class="nav-link" href="mine.html"><i class="fas fa-user"></i><span>我的</span></a>
                </div>
            </div>
        </div>
    </nav>
    <script>
        function toggleBooking(element) {
            if (element.classList.contains('available')) {
                element.classList.remove('available');
                element.classList.add('booked');
            } else {
                element.classList.remove('booked');
                element.classList.add('available');
            }
        }

        function confirmBooking() {
            alert('预约已确认！');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
